[package]
name = "envelope-keys"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"
description = "Envelope encryption key providers: a provider contract, wrapped data keys, and a conformance suite"
repository = "https://github.com/Sannrox/envelope-keys"
documentation = "https://docs.rs/envelope-keys"
readme = "README.md"
keywords = ["encryption", "envelope", "kek", "dek", "key-management"]
categories = ["cryptography"]
include = ["/src/**", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[dependencies]
aes-gcm = "0.10"
rand = { version = "0.8", features = ["std"] }
serde = { version = "1", features = ["derive"] }
zeroize = { version = "1", features = ["zeroize_derive"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
serde_json = "1"
